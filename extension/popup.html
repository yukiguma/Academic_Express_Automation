<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
        }

        #domain-display {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            word-break: break-all;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: default;
        }

        #status-msg {
            font-size: 12px;
            margin-top: 10px;
            height: 20px;
        }

        .active-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 0 5px;
            margin-left: 5px;
            line-height: 1;
        }

        .delete-btn:hover {
            color: #dc3545;
            background: none;
        }

        #update-panel {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #b9dfc4;
            border-radius: 6px;
            background: #f0faf3;
            text-align: left;
            font-size: 12px;
        }

        #update-panel strong {
            display: block;
            margin-bottom: 5px;
            color: #176b32;
        }

        #update-version {
            margin-bottom: 8px;
        }

        .update-download {
            display: block;
            box-sizing: border-box;
            padding: 9px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            background: #16803a;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        .update-download:hover {
            background: #11662e;
        }

        .update-secondary {
            padding: 0;
            margin: 0;
            width: auto;
            background: none;
            color: #555;
            text-decoration: underline;
            font-size: 11px;
        }

        .update-secondary:hover {
            background: none;
            color: #222;
        }

        #update-help {
            margin: 8px 0;
            color: #555;
            line-height: 1.5;
        }

        #update-check-row {
            margin-bottom: 10px;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>

<body>
    <h2>Academic Express Automation</h2>

    <div id="update-panel">
        <strong>新しいバージョンがあります</strong>
        <div id="update-version"></div>
        <a
            class="update-download"
            href="https://github.com/yukiguma/Academic_Express_Automation/releases/latest/download/academic-express-automation.zip"
            target="_blank"
            rel="noreferrer"
        >最新版ZIPをダウンロード</a>
        <div id="update-help">ダウンロード後、現在の拡張機能フォルダへ展開し、拡張機能を再読み込みしてください。</div>
        <button id="dismiss-update-btn" class="update-secondary">このバージョンを通知しない</button>
    </div>

    <div id="update-check-row">
        <span id="current-version"></span>
        <button id="check-update-btn" class="update-secondary">最新版を再確認</button>
        <span id="update-status"></span>
    </div>

    <div id="domain-display">Checking...</div>

    <button id="enable-btn">このサイトで有効にする</button>
    <button id="disable-btn" style="display:none; background-color: #dc3545;">このサイトで無効にする</button>

    <div id="status-msg"></div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <div style="text-align: left; font-size: 12px; color: #333; margin-bottom: 5px; font-weight: bold;">有効化済みのサイト:</div>
    <ul id="enabled-list" style="list-style: none; padding: 0; margin: 0; text-align: left; font-size: 11px;">
        <li style="color: #999;">読み込み中...</li>
    </ul>

    <script src="update-checker.js"></script>
    <script src="popup.js"></script>
</body>

</html>
